name: release

# Publishes each version tag, vX.Y.Z, as a GitHub Release, once tools/release checks it. The tag
# is annotated and on main, of the version that the commits since the previous tag call for. A
# refusal fails the job, and publishes nothing.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release the tag
        run: tools/release "$TAG"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
